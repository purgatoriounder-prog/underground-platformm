name: Bridge CI (frontend build + notebooks)

on:
  push:
    branches: [ "integrate-bridge" ]
  workflow_dispatch:
    inputs:
      run_heavy:
        description: 'Set to true to attempt running heavy notebooks (will install torch)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |-
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/tools/codespaces-jupyter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install minimal notebook dependencies (avoid heavy ML packages in CI)
        run: |
          pip install --upgrade pip
          pip install papermill nbformat matplotlib pandas || true

      - name: Run lightweight smoke-test notebook (matplotlib.ipynb)
        run: |
          mkdir -p artifacts
          NOTEBOOK=tools/codespaces-jupyter/notebooks/matplotlib.ipynb
          if [ -f "$NOTEBOOK" ]; then
            DIR=$(dirname "$NOTEBOOK")
            BASE=$(basename "$NOTEBOOK")
            pushd "$DIR"
            papermill "$BASE" "../../artifacts/matplotlib_ci.ipynb"
            popd
          else
            echo "Smoke-test notebook not found: $NOTEBOOK"
          fi

      - name: Run optional smoke-test notebook (population.ipynb)
        run: |
          NOTEBOOK=tools/codespaces-jupyter/notebooks/population.ipynb
          if [ -f "$NOTEBOOK" ]; then
            DIR=$(dirname "$NOTEBOOK")
            BASE=$(basename "$NOTEBOOK")
            pushd "$DIR"
            papermill "$BASE" "../../artifacts/population_ci.ipynb" || true
            popd
          else
            echo "Optional notebook not found: $NOTEBOOK"
          fi

      - name: Conditionally run heavy notebooks (image-classifier)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_heavy == 'true' }}
        run: |
          echo "Attempting heavy notebook run (this may take long and can fail on hosted runners)"
          pip install --upgrade pip
          if [ -f tools/codespaces-jupyter/requirements.txt ]; then pip install -r tools/codespaces-jupyter/requirements.txt || true; fi
          NOTEBOOK=tools/codespaces-jupyter/notebooks/image-classifier.ipynb
          if [ -f "$NOTEBOOK" ]; then
            DIR=$(dirname "$NOTEBOOK")
            BASE=$(basename "$NOTEBOOK")
            pushd "$DIR"
            papermill "$BASE" "../../artifacts/image_classifier_ci.ipynb" || true
            popd
          else
            echo "Heavy notebook not found: $NOTEBOOK"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-notebook-artifacts
          path: artifacts/*.ipynb

      - name: Create or update PR and attempt auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:integrate-bridge`;
            const base = 'main';
            const prs = await github.rest.pulls.list({ owner, repo, state: 'open', head: head, base: base });
            let pr;
            if (prs.data.length === 0) {
              const newPr = await github.rest.pulls.create({
                owner,
                repo,
                title: 'Integrate codespaces-jupyter + notebook-runner (bridge)',
                head: 'integrate-bridge',
                base: base,
                body: 'Automated PR created by Bridge CI after successful frontend build and notebook smoke-test.'
              });
              pr = newPr.data;
            } else {
              pr = prs.data[0];
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: 'Automated PR created by Bridge CI after successful frontend build and notebook smoke-test.' });
            }
            core.info(`PR is #${pr.number}`);
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, commit_title: `Merge: ${pr.title}`, merge_method: 'merge' });
              core.info(`PR #${pr.number} merged successfully.`);
            } catch (err) {
              core.info(`Auto-merge failed: ${err.message}`);
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `Automated merge attempt failed: ${err.message}. Please merge manually.` });
            }

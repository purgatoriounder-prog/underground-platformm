name: CI Merge NextJS to Main

on:
  push:
    branches: ["merge-nextjs"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Create or update PR and attempt auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:merge-nextjs`;
            const base = 'main';

            // Find existing open PR from this head to base
            const prs = await github.rest.pulls.list({ owner, repo, state: 'open', head: head, base: base });

            let pr;
            if (prs.data.length === 0) {
              const newPr = await github.rest.pulls.create({
                owner,
                repo,
                title: 'Integrate nextjs into frontend/ (preserve existing frontend files)',
                head: 'merge-nextjs',
                base: base,
                body: 'Automated PR created by workflow after successful build.'
              });
              pr = newPr.data;
            } else {
              pr = prs.data[0];
              // update the PR body to reflect CI success
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: 'Automated PR created by workflow after successful build.' });
            }

            core.info(`PR is #${pr.number}`);

            // Attempt to merge the PR
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, commit_title: `Merge: ${pr.title}`, merge_method: 'merge' });
              core.info(`PR #${pr.number} merged successfully.`);
            } catch (err) {
              core.info(`Auto-merge failed: ${err.message}`);
              // leave a comment on the PR explaining merge failed
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `Automated merge attempt failed: ${err.message}. Please merge manually.` });
            }
